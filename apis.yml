aid: efex-ventu
name: EFEX (Ventu)
description: >-
  EFEX (efex.com, formerly efexpay.com) is a cross-border payments and treasury
  fintech serving businesses across the Americas. It enables international
  transfers to 140+ countries, bulk and mass payouts for payroll and
  multi-beneficiary disbursement, multi-currency business accounts (USD, MXN,
  EUR, GBP, CAD, JPY), international collections in local currency across 24+
  countries, and FX and currency management for treasury optimization.
  Headquartered in Palo Alto, California with operations across Mexico (Mexico
  City, Monterrey, Tijuana, Queretaro, Guadalajara) and Colombia, EFEX is
  authorized by Mexico's CNBV as a money transmitter (registration 22469) and
  regulated by FinCEN in the United States. Backed by 500 Global. As of this
  profile the company exposes a business web/app product but no public developer
  API, developer portal, or API documentation.
